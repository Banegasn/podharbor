[package]
name = "podharbor"
version = "0.1.2"
description = "Desktop Kubernetes pods, workloads and logs console"
authors = ["banegasn"]
license = "MIT"
repository = "https://github.com/Banegasn/podharbor"
edition = "2021"
rust-version = "1.89"

[lib]
name = "podharbor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3.34"
k8s-openapi = { version = "0.28.0", features = ["latest"] }
kube = { version = "4.2.0", features = ["client", "config", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = { package = "yaml_serde", version = "0.10.7" }
tauri = { version = "2.11.6", features = ["devtools"] }
tokio = { version = "1.53.1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
