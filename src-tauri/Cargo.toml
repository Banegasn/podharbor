[package]
name = "podharbor"
version = "0.1.1"
description = "Desktop Kubernetes pods, workloads and logs console"
authors = ["banegasn"]
license = "MIT"
repository = "https://github.com/Banegasn/podharbor"
edition = "2021"
rust-version = "1.89"

[lib]
name = "podharbor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
k8s-openapi = { version = "0.28", features = ["latest"] }
kube = { version = "4", features = ["client", "config", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tauri = { version = "2", features = ["devtools"] }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
